# M8 — nginx as load balancer in front of N api replicas.
# The docker embedded DNS (127.0.0.11) is re-queried at runtime so that
# `docker compose up --scale api=3` is picked up without restarting nginx,
# and a container killed with `kill -9` drops out of rotation.
resolver 127.0.0.11 valid=5s ipv6=off;


server {
    listen 80;
    server_name _;

    # Buffers/timeouts tuned so a dying upstream fails fast instead of hanging.
    proxy_connect_timeout 2s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    location / {
        set $upstream_api api:3000;
        proxy_pass http://$upstream_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Propagate the trace id so one request is followable across nginx -> api -> kafka.
        proxy_set_header X-Request-Id      $request_id;

        # If one replica dies mid-request, retry the next one (M8 acceptance criteria).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
