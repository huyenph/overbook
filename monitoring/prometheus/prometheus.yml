global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: overbook

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # DNS service discovery, not a static target: `docker compose up --scale api=3`
  # makes `api` resolve to 3 A records, and each replica is scraped separately.
  # That is what makes the M8 dashboards show per-instance traffic.
  - job_name: overbook-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 3000
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: replica
